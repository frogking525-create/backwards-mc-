pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets Gradle automatically download JDK 25 itself for compiling, regardless of which
    // JVM is running Gradle - fixes "release version 25 not supported" when the CI runner's
    // default/active JDK is older than 25.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "backwards-challenge"

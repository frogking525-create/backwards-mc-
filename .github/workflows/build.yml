name: Build mod jar

on:
  push:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 9.5.1
          fi
          chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: List everything Gradle actually produced (for debugging)
        run: |
          echo "--- full build/ directory tree ---"
          find build -type d | sort
          echo "--- compiled .class files, if any ---"
          find build -name "*.class" | head -20
          echo "--- count of .class files ---"
          find build -name "*.class" | wc -l
          echo "--- resources (fabric.mod.json etc), if any ---"
          find build -name "fabric.mod.json" -o -name "*.mixins.json"
          echo "--- build/libs contents ---"
          ls -la build/libs || true
          echo "--- contents of each jar found ---"
          for f in build/libs/*.jar; do
            echo "=== $f ==="
            unzip -l "$f" | head -30
          done

      - name: Upload every jar Gradle produced
        uses: actions/upload-artifact@v4
        with:
          name: backwards-challenge-mod
          path: build/libs/*.jar
          if-no-files-found: error
